<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>

<body>
    <form id='registerForm' class='auth-form'>
        <input type='text' id='registerUsername' name='username' placeholder='Username' required>
        <input type='text' id='registerName' name='name' placeholder='Name' required>
        <input type='text' id='registerLastName' name='lastName' placeholder='Last name' required>
        <input type='email' id='registerEmail' name='email' placeholder='Email' required>
        <input type='password' id='registerPassword' name='password' placeholder='Password' required>
        <input type='password' id='registerConfirmPassword' name='confirmPassword' placeholder='Confirm Password' required>
        
        <label for="uloga">Uloga:</label>
        <select id="uloga" name="uloga" required>
            <option value="strucnjak" selected>Strucnjak</option>
            <option value="operater">Operater drona</option>
            <option value="gradjanin">Gradjanin</option>
            <option value="admin">Admin</option>
        </select>
        
        <button type='submit' class='auth-button'>Register</button>
        <p id="greska"></p>
    </form>
    <script src="config.js"></script>
    <script src="register.js"></script>
</body>

</html>
